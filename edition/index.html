<!DOCTYPE html>
<html>
<head>
  <title>Editions</title>
</head>
<body>
  <h1>Editions</h1>
  <div id="list"></div>

  <script>
  fetch("editions.json")
    .then(res => res.json())
    .then(data => {
      const container = document.getElementById("list");

      data.forEach(ed => {
        const a = document.createElement("a");
        a.href = ed.file;
        a.textContent = ed.title;
        a.style.display = "block";
        container.appendChild(a);
      });
    });
  </script>
</body>
</html>
